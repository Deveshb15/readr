<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs>
  <radialGradient id="body" cx="0.3" cy="0.18" r="0.95">
    <stop offset="0%" stop-color="#6B5BFF"/><stop offset="38%" stop-color="#2B17EC"/><stop offset="78%" stop-color="#1604B8"/><stop offset="100%" stop-color="#0C0088"/>
  </radialGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><path d="M356.0 340.0 Q356 236 460.0 236.0 L564.0 236.0 Q668 236 668.0 340.0 L668.0 746.0 Q668 792 633.3 761.8 L540.6 681.0 Q512 656 483.4 681.0 L390.7 761.8 Q356 792 356.0 746.0 Z"/></clipPath>
  <filter id="drop" x="-40%" y="-30%" width="180%" height="170%">
    <feDropShadow dx="0" dy="34" stdDeviation="36" flood-color="#2A1BA8" flood-opacity="0.30"/>
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A0E6E" flood-opacity="0.18"/>
  </filter>
  <filter id="b60" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="b28" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="b10" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="b5" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter></defs><g transform="translate(512 520) scale(1.1) translate(-512 -514)">
  <!-- ambient ink glow under the ribbon -->
  <ellipse cx="520" cy="600" rx="210" ry="230" fill="#3524F0" fill-opacity="0.32" filter="url(#b60)"/>
  <g filter="url(#drop)"><path d="M356.0 340.0 Q356 236 460.0 236.0 L564.0 236.0 Q668 236 668.0 340.0 L668.0 746.0 Q668 792 633.3 761.8 L540.6 681.0 Q512 656 483.4 681.0 L390.7 761.8 Q356 792 356.0 746.0 Z" fill="url(#body)"/></g>
  <g clip-path="url(#clip)">
    <!-- inner rim: edges darken toward bottom-right, so the ribbon reads as inflated -->
    <path d="M356.0 340.0 Q356 236 460.0 236.0 L564.0 236.0 Q668 236 668.0 340.0 L668.0 746.0 Q668 792 633.3 761.8 L540.6 681.0 Q512 656 483.4 681.0 L390.7 761.8 Q356 792 356.0 746.0 Z" fill="none" stroke="#06004A" stroke-opacity="0.5" stroke-width="96" filter="url(#b28)" transform="translate(16 26)"/>
    <!-- soft top-left bloom -->
    <ellipse cx="452" cy="330" rx="150" ry="120" fill="#FFFFFF" fill-opacity="0.32" filter="url(#b28)"/>
    <!-- pillow specular streak down the left side -->
    <rect x="398" y="292" width="46" height="330" rx="23" fill="url(#streak)" filter="url(#b10)"/>
    <!-- crisp top lip highlight -->
    <path d="M430 268 Q512 256 594 268" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" filter="url(#b5)"/>
  </g></g></svg>
